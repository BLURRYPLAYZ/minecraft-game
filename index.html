<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockWorld</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="crosshair">+</div>

    <div id="hotbar">
        <div class="slot selected" data-block="grass">🌿</div>
        <div class="slot" data-block="dirt">🟫</div>
        <div class="slot" data-block="stone">⬜</div>
        <div class="slot" data-block="wood">🪵</div>
        <div class="slot" data-block="leaves">🌿</div>
    </div>

    <div id="instructions">
        <b>BLOCKWORLD</b><br><br>
        WASD — Move<br>
        SPACE — Jump<br>
        Mouse — Look<br>
        Left Click — Break<br>
        Right Click — Place<br>
        1–5 — Select Block<br><br>
        <small>Click the game to start</small>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
